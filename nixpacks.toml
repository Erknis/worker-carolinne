[phases.setup]
nixPkgs = [
  "python3",
  "gcc",
  "glibc",
  "gcc-unwrapped",
  "nss",
  "nspr",
  "dbus",
  "atk",
  "at-spi2-core",
  "cups",
  "libdrm",
  "libxkbcommon",
  "libxcomposite",
  "libxdamage",
  "libxfixes",
  "libxrandr",
  "mesa",
  "alsa-lib",
  "pango",
  "cairo",
  "libx11",
  "libxcb",
  "libxext",
  "fontconfig",
  "freetype",
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install -r requirements.txt",
  "playwright install-deps chromium",
  "playwright install chromium"
]

[phases.start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"
