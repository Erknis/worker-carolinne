phases.setup]
nixPkgs = [
  "python3",
  "gcc",
  "glibc",
  "gcc-unwrapped",           # libstdc++.so.6
  "nss",                     # libnss3
  "nspr",                    # libnspr4
  "dbus",                    # libdbus-1-3
  "atk",                     # libatk1.0-0
  "at-spi2-core",            # libatk-bridge2.0-0, libatspi2.0-0
  "cups",                    # libcups2
  "libdrm",                  # libdrm2
  "libxkbcommon",            # libxkbcommon0
  "libxcomposite",           # libxcomposite1
  "libxdamage",              # libxdamage1
  "libxfixes",               # libxfixes3
  "libxrandr",               # libxrandr2
  "mesa",                    # libgbm1
  "alsa-lib",                # libasound2
  "pango",                   # libpango-1.0-0
  "cairo",                   # libcairo2
  "libx11",                  # libX11
  "libxcb",                  # libxcb
  "libxext",                 # libXext
  "fontconfig",              # fontconfig
  "freetype",                # freetype
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install -r requirements.txt",
  "playwright install-deps chromium",  # instala deps do Chromium
  "playwright install chromium"        # baixa o Chromium
]

[phases.start]
cmd = "/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"
